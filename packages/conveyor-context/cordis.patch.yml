# conveyor-context bundle patch — insert the plugin row into the profile cordis.yml.
# activateConveyor: default true when the session-projection seam is composed.
- insert:
    - id: conveyor-context
      name: '@dsh-brain/conveyor-context'
      # 禁用：实测该插件记忆侧空转（kept=0/folds=0），压缩本就委托给 dsh 原生 compaction。恢复时删掉 disabled 即可。
      disabled: true
      config:
        foldEveryTurns: 6
        maxKeptFacts: 32